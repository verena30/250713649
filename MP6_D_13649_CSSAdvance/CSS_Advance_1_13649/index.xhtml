<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Formulir Pendaftaran Lomba</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
</head>
<body>
    <div id="banner">
        <h1>Formulir Pendaftaran Atmafest</h1>
        <h4>Atmafest Registration Form</h4>
    </div>

    <div id="isi">
        <form action="" method="post" enctype="multipart/form-data">

            <table>

                <tr>
                    <td id="keterangan">
                        <label for="namatim">
                            <strong>Nama Tim</strong><br />
                            <i>Team Name</i>
                        </label>
                    </td>
                    <td>
                        <input type="text" id="namatim" name="namatim" />
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="ketua">
                            <strong>Nama Ketua Tim</strong><br />
                            <i>Team Leader</i>
                        </label>
                    </td>
                    <td>
                        <input type="text" id="ketua" name="ketua" />
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="jumlah">
                            <strong>Jumlah Anggota</strong><br />
                            <i>Number of Members</i>
                        </label>
                    </td>

                    <td>
                        <select id="jumlah" name="jumlah">
                            <option>1</option>
                            <option>2</option>
                            <option>3</option>
                            <option>4</option>
                            <option>5</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="telepon">
                            <strong>Nomor Kontak Tim</strong><br />
                            <i>Team Contact Number</i>
                        </label>
                    </td>
                    <td>
                        <input type="text" id="telepon" name="telepon" />
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="universitas">
                            <strong>Asal Universitas</strong><br />
                            <i>University / Institution</i>
                        </label>
                    </td>
                    <td>
                        <input type="text" id="universitas" name="universitas" />
                    </td>
                </tr>

                <tr>
                    <td>
                        <strong>Bidang Lomba</strong><br />
                        <i>Competition Categories</i>
                    </td>
                    <td>
                        <p>
                            <input type="checkbox" id="coding"
                                   name="bidang" value="Coding" />
                            <label for="coding">Coding</label>

                            <input type="checkbox" id="desain"
                                   name="bidang" value="Desain" />
                            <label for="desain">Design</label>
                        </p>

                        <p>
                            <input type="checkbox" id="video"
                                   name="bidang" value="Video" />
                            <label for="video">Video</label>

                            <input type="checkbox" id="essay"
                                   name="bidang" value="Essay" />
                            <label for="essay">Essay</label>
                        </p>
                    </td>
                </tr>

                <tr>
                    <td>
                        <strong>Kategori Peserta</strong><br />
                        <i>Participant Category</i>
                    </td>
                    <td>
                        <input type="radio" id="mahasiswa"
                               name="peserta" value="Mahasiswa" />
                        <label for="mahasiswa">
                            Mahasiswa <i>(Student)</i>
                        </label>

                        <input type="radio" id="umum"
                               name="peserta" value="Umum" />
                        <label for="umum">
                            Umum <i>(General)</i>
                        </label>
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="deskripsi">
                            <strong>Deskripsi Karya</strong><br />
                            <i>Project Description</i>
                        </label>
                    </td>
                    <td>
                        <textarea id="deskripsi" name="deskripsi"
                                  rows="10" cols="30"></textarea>
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="alasan">
                            <strong>Motivasi Mengikuti Lomba</strong><br />
                            <i>Motivation for Joining</i>
                        </label>
                    </td>
                    <td>
                        <textarea id="alasan" name="alasan"
                                  rows="7" cols="30"></textarea>
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="filekarya">
                            <strong>Unggah Berkas Karya</strong><br />
                            <i>Upload Project File</i>
                        </label>
                    </td>
                    <td>
                        <input type="file" id="filekarya" name="filekarya"
                               accept="application/pdf, image/jpeg, image/png" />
                    </td>
                </tr>

                <tr>
                    <td colspan="2" id="bagian-kirim">
                        <p id="catatan">
                            Please make sure all information is filled out correctly
                            before submitting your registration.
                        </p>
                        <input type="submit" id="daftar" name="daftar"
                               value="Submit Registration" />
                    </td>
                </tr>
            </table>
        </form>
    </div>
</body>
</html>
